    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      padding: clamp(4rem, 12vw, 8rem) 6vw 8rem;

      margin: 0 auto 2.5rem;

    }
    .stub-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .stub h1 { font-weight: 700; font-size: clamp(1.8rem, 4vw, 2.6rem); letter-spacing: -0.01em; margin-bottom: 1rem; }

    .stub-back { display: inline-block; margin-top: 2.5rem; font-weight: 600; font-size: 0.85rem; color: #0077FF; border-bottom: 1px solid rgba(0,119,255,0.35); padding-bottom: 2px; transition: border-color 0.2s; }
    .stub-back:hover { border-color: #0077FF; }

    @media (max-width: 700px) {
      .hero-nav { justify-content: center; }
      .hero-nav-pill { gap: 1rem; padding: 0.55rem 1.1rem; flex-wrap: wrap; justify-content: center; }
