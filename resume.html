  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: #ddd5c3;
      background-image: linear-gradient(rgba(255,255,255,0.35), rgba(255,255,255,0.35)), url('index_redesign/index_section_bg.png');
      background-size: auto, auto;
      background-repeat: repeat, repeat;
      background-position: top center, top center;
      color: #2a2018;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    a { text-decoration: none; color: inherit; }

    /* ── NAV (matches the redesigned homepage) ────────────────── */
    .gc-nav {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.1rem clamp(1.5rem, 5vw, 4rem) 1rem;
    }
    .gc-nav-logo {
      position: relative;
      display: inline-flex;
      align-items: center;
      text-decoration: none;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .gc-nav-logo .highlight {
      position: absolute;
      left: -24px;
      top: 50%;
      transform: translateY(-42%);
      width: calc(100% + 48px);
      height: 3.2em;
      z-index: -1;
      opacity: 0;
      transition: opacity 0.2s ease;
      pointer-events: none;
      user-select: none;
    }
    .gc-nav-logo:hover .highlight { opacity: 1; }
    .gc-nav-logo span {
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      font-size: 1.05rem;
      color: #16130f;
    }
    .gc-nav-links {
      display: flex;
      align-items: center;
      gap: 2rem;
    }
    .gc-nav-link {
      position: relative;
      display: inline-flex;
      align-items: center;
      font-family: 'Poppins', sans-serif;
      font-weight: 500;
      font-size: 1rem;
      color: #16130f;
      padding: 0.1rem 0.2rem;
      text-decoration: none;
      white-space: nowrap;
    }
    .gc-nav-link .highlight {
      position: absolute;
      left: -14px;
      top: 50%;
      transform: translateY(-42%);
      width: calc(100% + 28px);
      height: 2.8em;
      z-index: -1;
      opacity: 0;
      transition: opacity 0.2s ease;
      pointer-events: none;
      user-select: none;
    }
    .gc-nav-link.active .highlight,
    .gc-nav-link:hover .highlight { opacity: 1; }
    @media (max-width: 700px) {
      .gc-nav-links { gap: 1rem; }
      .gc-nav-link { font-size: 0.85rem; }
    }

    /* ── RESUME AREA ─────────────────────────────────────────────── */
    .resume-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3rem 2rem 4rem;
    }

    .resume-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 860px;
      margin-bottom: 1.25rem;
    }

    .resume-label {
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      font-size: 0.875rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: rgba(22,19,15,0.45);
    }

    .resume-download {
      font-family: 'Poppins', sans-serif;
      font-weight: 400;
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #2a2018;
      border: 1px solid rgba(42,32,24,0.3);
      border-radius: 999px;
      padding: 0.5rem 1.4rem;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }
    .resume-download:hover {
      background: #2a2018;
      color: #fff;
      border-color: #2a2018;
    }

    .resume-frame {
      width: 100%;
      max-width: 860px;
      height: 80vh;
      border: 1px solid rgba(42,32,24,0.1);
      border-radius: 0.5rem;
      overflow: hidden;
    }

    .resume-frame iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* ── FOOTER ──────────────────────────────────────────────────── */
    .site-footer-cta {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      padding: 4rem 6vw 3.5rem;
      text-align: center;
    }
    .footer-jar { width: 56px; height: auto; }
    .footer-cta-text {
      font-family: 'Poppins', sans-serif;
      font-weight: 700;
      font-size: 0.875rem;
      letter-spacing: 0.04em;
      color: #16130f;
    }
    .footer-social {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-top: 0.25rem;
    }
    .footer-social a {
      display: flex;
      align-items: center;
      justify-content: center;
      color: #16130f;
      opacity: 0.7;
      transition: opacity 0.2s;
    }
    .footer-social a:hover { opacity: 1; }
    .footer-social svg { width: 18px; height: 18px; }
